{% extends "base.html" %}
{% block title %}Add New Invoice{% endblock %}
{% block content %}
<h1>Add New Invoice</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/invoices/new" class="invoice-form" id="new-invoice-form">
  <label for="invoice_number">Invoice Number</label>
  <input id="invoice_number" name="invoice_number" type="text" value="{{ form.invoice_number }}" required />

  <label for="customer_name">Customer Name</label>
  <input id="customer_name" name="customer_name" type="text" value="{{ form.customer_name }}"
         placeholder="e.g. Rahul Verma" required />

  <label for="customer_email">Customer Email</label>
  <input id="customer_email" name="customer_email" type="email" value="{{ form.customer_email }}"
         placeholder="e.g. rahul.verma@example.com" required />

  <label for="amount">Amount (Rs.)</label>
  <input id="amount" name="amount" type="number" step="0.01" min="0.01" value="{{ form.amount }}" required />

  <label for="status">Status</label>
  <select id="status" name="status">
    <option value="unpaid" {% if form.status == "unpaid" %}selected{% endif %}>Unpaid</option>
    <option value="paid" {% if form.status == "paid" %}selected{% endif %}>Paid</option>
  </select>

  <label for="date">Date</label>
  <input id="date" name="date" type="date" value="{{ form.date }}" required />

  <button type="submit" class="btn" id="save-invoice-btn">Save Invoice</button>
</form>
<p><a href="/invoices">&larr; Back to invoices</a></p>
{% endblock %}
